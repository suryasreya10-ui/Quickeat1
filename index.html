<!DOCTYPE html>
<html>
<head>
    <title>College Canteen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ADMIN LOGIN BUTTON -->
<button onclick="openAdminLogin()" class="admin-login-btn">Admin Login</button>

<!-- HEADER -->
<div class="header">
    <h2>🏫 College Canteen</h2>
</div>

<!-- SEARCH -->
<div class="search-container"> 
    <input type="text" id="searchInput" placeholder="Search food...">
</div>

<!-- TODAY SPECIAL -->
<div class="special" id="specialContainer" onclick="showQuantitySelectorForSpecial()">
    ⭐ Today Special: Chicken Biriyani ₹120
    <span class="special-add-btn">Add to Cart</span>
</div>

<!-- QUANTITY SELECTOR FOR SPECIAL -->
<div id="specialQtySelector" class="special-qty-selector" style="display: none;">
    <div class="special-qty-content">
        <h3 id="specialItemName">Special Item</h3>
        <div class="qty-controls">
            <button onclick="decrementSpecialQty()">−</button>
            <input type="text" id="specialQtyInput" value="1" readonly>
            <button onclick="incrementSpecialQty()">+</button>
        </div>
        <button onclick="confirmAddSpecialToCart()" class="confirm-special-btn">Add to Cart</button>
        <button onclick="cancelSpecialQtySelector()" class="cancel-special-btn">Cancel</button>
    </div>
</div>

<!-- CATEGORIES -->
<div class="categories">
    <div class="category" onclick="filterByCategory('Meals')">🍛 food items</div>
    <div class="category" onclick="filterByCategory('Meals')">🍛 Meals</div>
    <div class="category" onclick="filterByCategory('Snacks')">🥪 Snacks</div>
    <div class="category" onclick="filterByCategory('Drinks')">🥤 Drinks</div>
    <div class="category" onclick="filterByCategory('Dessert')">🍰 Dessert</div>
    <div class="category" onclick="filterByCategory('Chocolates')">🍫 Chocolates</div>
</div>

<!-- FOOD ITEMS -->
<div class="food-list" id="foodList"></div>

<!-- CART -->
<div class="cart">
    <h3>Your Order</h3>
    <div id="cartItems"></div>
    <h2 id="total">Total: ₹0</h2>
    <button onclick="showBill()">Place Order</button>
</div>

<!-- BILL -->
<div id="bill" class="bill"></div>

<!-- PAYMENT -->
<div id="payment" class="payment">
    <h3>Scan QR to Pay</h3>
    <img src="qr.jpeg" alt="QR Code" width="100" height="100" style="margin: 0 auto; display: block;">
    <p style="text-align: center; margin-top: 20px; font-size: 1.2em; font-weight: 700; color: #4a7c59;">PAY</p>
    <button onclick="completePayment()" style="margin-top: 25px;">Confirm Payment</button>
</div>

<!-- SUCCESS -->
<div id="success" class="success"></div>

<!-- ADMIN LOGIN MODAL -->
<div id="adminLoginModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeAdminLogin()">&times;</span>
        <h2>Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter admin password" onkeypress="if(event.key==='Enter') loginAdmin()">
        <button onclick="loginAdmin()">Login</button>
        <p id="adminLoginError" style="color: red; margin-top: 10px;"></p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-panel">
    <div class="admin-header">
        <h2>🔐 Admin Panel</h2>
        <button onclick="logoutAdmin()" class="logout-btn">Logout</button>
    </div>
    
    <!-- TABS -->
    <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchAdminTab('payments')">💳 Payments</button>
        <button class="tab-btn" onclick="switchAdminTab('stock')">📦 Stock Control</button>
        <button class="tab-btn" onclick="switchAdminTab('special')">⭐ Special Items</button>
    </div>
    
    <!-- PAYMENTS TAB -->
    <div id="paymentsTab" class="admin-tab-content">
        <div id="pendingPayments" class="pending-payments"></div>
    </div>
    
    <!-- STOCK CONTROL TAB -->
    <div id="stockTab" class="admin-tab-content" style="display: none;">
        <div class="stock-control">
            <h3 style="color: #4a7c59; margin-bottom: 15px;">📦 Food Items Stock Status</h3>
            <div id="stockItems" class="stock-items"></div>
        </div>
    </div>

    <!-- SPECIAL ITEMS TAB -->
    <div id="specialTab" class="admin-tab-content" style="display: none;">
        <div class="special-control">
            <h3 style="color: #4a7c59; margin-bottom: 15px;">⭐ Today's Special Items</h3>
            <div id="specialItems" class="special-items"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
